name: Release

# Pushing a tag vMAJOR.MINOR.PATCH builds, signs and publishes a GitHub
# release in the layout registry.terraform.io and the OpenTofu registry read.
# Both registries poll this repository's releases; nothing is pushed to them.
#
# Secrets (repository or org):
#   GPG_PRIVATE_KEY  ASCII-armoured private key whose public half is added to
#                    the vulnetix namespace on registry.terraform.io (and to
#                    the OpenTofu registry's key list for the provider).
#   PASSPHRASE       That key's passphrase.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    # The x64 pool is Amazon Linux 2023 with no apt or sudo, and its image has
    # no gpg or gpgconf, which crazy-max/ghaction-import-gpg needs. Docker is
    # there, so run the job in a Debian image that carries GnuPG (gpg, gpgconf,
    # gpg-agent), pinned by the digest of the multi-arch index. The local
    # podman pool answers the same label, so this runs on either.
    container:
      image: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
    timeout-minutes: 30
    steps:
      # Big Go builds overflow the runner's small /tmp; build in the job's temp.
      - name: Use the job temp dir for Go
        run: echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # The registries refuse an unsigned release, so stop before building
      # one when the signing key has not been added.
      - name: Check for the signing secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Add the GPG_PRIVATE_KEY and PASSPHRASE secrets (the key registered on the registries) before tagging a release."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Test
        run: go test ./...
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
