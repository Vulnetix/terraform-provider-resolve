name: Release

# Pushing a tag vMAJOR.MINOR.PATCH builds, signs and publishes a GitHub
# release in the layout registry.terraform.io and the OpenTofu registry read.
# Both registries poll this repository's releases; nothing is pushed to them.
#
# Secrets (repository or org):
#   GPG_PRIVATE_KEY  ASCII-armoured private key whose public half is added to
#                    the vulnetix namespace on registry.terraform.io (and to
#                    the OpenTofu registry's key list for the provider).
#   PASSPHRASE       That key's passphrase.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 30
    steps:
      # Big Go builds overflow the runner's small /tmp; build in the job's temp.
      - name: Use the job temp dir for Go
        run: echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Test
        run: go test ./...
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
