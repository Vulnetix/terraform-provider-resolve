# Release layout the Terraform and OpenTofu registries require:
#   terraform-provider-resolve_<version>_<os>_<arch>.zip
#   terraform-provider-resolve_<version>_manifest.json   (protocol versions)
#   terraform-provider-resolve_<version>_SHA256SUMS
#   terraform-provider-resolve_<version>_SHA256SUMS.sig  (detached GPG, binary)
# The registry checks the .sig against the public key added to the namespace,
# so the signing key must be the one registered there.
version: 2

# The registries name archives terraform-provider-{type}_..., and the type in
# the address vulnetix/resolve is "resolve". Resources keep the vulnetix_
# prefix, which comes from the provider's local name, not from this address.
project_name: terraform-provider-resolve

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  use: github
