# Every field with a schema default, set to that default, plus the required
# fields from config-schemas examples/AiGovernanceList/minimal.yaml. reference.tf is the same
# document as Terraform.
apiVersion: vulnetix.com/v1
kind: AiGovernanceList
metadata:
  name: deny-shell-tools
spec:
  action: block
  enabled: true
  family: tool
  list: deny
  patterns:
    - Bash
  priority: 100
