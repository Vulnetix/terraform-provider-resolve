# Every field with a schema default, set to that default, plus the required
# fields from config-schemas examples/QualityGate/minimal.yaml. reference.tf is the same
# document as Terraform.
apiVersion: vulnetix.com/v1
kind: QualityGate
metadata:
  name: default
spec:
  eol:
    severities:
      nextQuarter: low
      retired: critical
      thisQuarter: medium
      within30Days: high
