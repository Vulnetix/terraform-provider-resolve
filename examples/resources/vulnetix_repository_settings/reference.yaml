# Every field with a schema default, set to that default, plus the required
# fields from config-schemas examples/RepositorySettings/minimal.yaml. reference.tf is the same
# document as Terraform.
apiVersion: vulnetix.com/v1
kind: RepositorySettings
metadata:
  name: acme-payments-api
spec:
  autonomy: draft_pr
  defaultsOff: []
  kanbanMode: "off"
  labels: {}
  protectedBranches: true
  repository: acme/payments-api
  teaPublish: false
