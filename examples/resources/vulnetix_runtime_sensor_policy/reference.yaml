# Every field with a schema default, set to that default, plus the required
# fields from config-schemas examples/RuntimeSensorPolicy/minimal.yaml. reference.tf is the same
# document as Terraform.
apiVersion: vulnetix.com/v1
kind: RuntimeSensorPolicy
metadata:
  name: engineering-laptops
spec:
  allowMajorUpdate: false
  allowUserStop: false
  autoUpdate: true
  credentialMode: device-key
  enabled: true
  heartbeatAlertMinutes: 15
  hold: 15m
  inventoryEvery: 6h
  mode: monitor
  priority: 100
  protection: hardened
