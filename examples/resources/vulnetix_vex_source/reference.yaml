# Every field with a schema default, set to that default, plus the required
# fields from config-schemas examples/VexSource/minimal.yaml. reference.tf is the same
# document as Terraform.
apiVersion: vulnetix.com/v1
kind: VexSource
metadata:
  name: local-vex
spec:
  format: auto
  onError: keep-last
  path:
    path: .vulnetix/vex.openvex.json
  trust:
    requireSignature: false
